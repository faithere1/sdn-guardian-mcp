[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdn-guardian-mcp"
version = "0.1.0"
description = "Closed-loop SDN defense and safe policy execution via MCP and Cisco open-weight models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.14,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
live = ["ncclient>=0.7,<1"]
llm = [
    "transformers>=5.21,<6",
    "accelerate>=1.15,<2",
    "bitsandbytes>=0.50,<1",
    "huggingface_hub>=2.3,<3",
]
dev = ["pytest>=9.2,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.17,<1"]

[project.scripts]
sdn-guardian-mcp = "sdn_guardian.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
